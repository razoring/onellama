      - generic [ref=f5e137]:
        - paragraph [ref=f5e138]
        - paragraph [ref=f5e140]: The Meta Llama 3.2 collection of multilingual large language models (LLMs) is a collection of pretrained and instruction-tuned generative models in 1B and 3B sizes (text in/text out). The Llama 3.2 instruction-tuned text only models are optimized for multilingual dialogue use cases, including agentic retrieval and summarization tasks. They outperform many of the available open source and closed chat models on common industry benchmarks.
        - heading "Sizes" [level=2] [ref=f5e141]
        - heading "3B parameters (default)" [level=3] [ref=f5e142]
        - paragraph [ref=f5e143]: "The 3B model outperforms the Gemma 2 2.6B and Phi 3.5-mini models on tasks such as:"
        - list [ref=f5e144]:
          - listitem [ref=f5e145]: Following instructions
          - listitem [ref=f5e146]: Summarization
          - listitem [ref=f5e147]: Prompt rewriting
          - listitem [ref=f5e148]: Tool use
        - code [ref=f5e150]: ollama run llama3.2
        - heading "1B parameters" [level=3] [ref=f5e151]
        - paragraph [ref=f5e152]: "The 1B model is competitive with other 1-3B parameter models. It’s use cases include:"
        - list [ref=f5e153]:
          - listitem [ref=f5e154]: Personal information management
          - listitem [ref=f5e155]: Multilingual knowledge retrieval
          - listitem [ref=f5e156]: Rewriting tasks running locally on edge
        - code [ref=f5e158]: ollama run llama3.2:1b
        - heading "Benchmarks" [level=3] [ref=f5e159]
        - paragraph [ref=f5e160]:
          - img "Llama 3.2 instruction-tuned benchmarks" [ref=f5e161]
        - paragraph [ref=f5e162]:
          - strong [ref=f5e163]: "Supported Languages:"
          - text: English, German, French, Italian, Portuguese, Hindi, Spanish, and Thai are officially supported. Llama 3.2 has been trained on a broader collection of languages than these 8 supported languages.
